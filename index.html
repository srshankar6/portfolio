<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First GitHub Page</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
            text-align:center;
            width:400px;
        }

        h1{
            color:#0366d6;
        }

        button{
            padding:10px 20px;
            font-size:16px;
            cursor:pointer;
            border:none;
            background:#0366d6;
            color:white;
            border-radius:6px;
        }

        button:hover{
            background:#024ea2;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🎉 GitHub Pages Works!</h1>

    <p>
        This website is hosted for free using GitHub Pages.
    </p>

    <button onclick="showMessage()">
        Click Me
    </button>

    <p id="msg"></p>
</div>

<script>
function showMessage(){
    document.getElementById("msg").innerHTML =
        "Hello from GitHub Pages!";
}
</script>

</body>
</html>
